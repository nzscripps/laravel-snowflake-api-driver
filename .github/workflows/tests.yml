name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    # Pinned rather than ubuntu-latest: that label migrates to Ubuntu 26 on
    # 2026-10-19, and the oldest PHP builds in the matrix (8.0/8.1) are not
    # guaranteed to be installable by setup-php on a brand-new image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      # Composer >= 2.9 refuses to resolve versions with published security
      # advisories. Every Laravel 8/9 release (and most 10/11 ones) has some,
      # so without this those lanes either fail to resolve or silently fall
      # back to a dev branch. This is a compatibility test of a library, not a
      # deployment, so test against the real tagged releases.
      COMPOSER_NO_SECURITY_BLOCKING: 1

    strategy:
      fail-fast: false
      matrix:
        # What composer.json supports (illuminate/* ^8 - ^12), exercised at the
        # oldest and newest PHP each Laravel major officially runs on. The
        # source uses PHP 8.0 syntax (union types, `mixed`, str_contains()), so
        # PHP 7.x cannot run it even though composer.json still says ^7.3.
        include:
          # Laravel 8 (Testbench 6, PHPUnit 9)
          - { php: '8.0', laravel: '8', testbench: '^6.0' }
          - { php: '8.1', laravel: '8', testbench: '^6.0' }
          # Laravel 9 (Testbench 7, PHPUnit 9)
          - { php: '8.1', laravel: '9', testbench: '^7.0' }
          - { php: '8.2', laravel: '9', testbench: '^7.0' }
          # Laravel 10 (Testbench 8, PHPUnit 10)
          - { php: '8.1', laravel: '10', testbench: '^8.0' }
          - { php: '8.3', laravel: '10', testbench: '^8.0' }
          # Laravel 11 (Testbench 9, PHPUnit 11)
          - { php: '8.2', laravel: '11', testbench: '^9.0' }
          - { php: '8.4', laravel: '11', testbench: '^9.0' }
          # Laravel 12 (Testbench 10, PHPUnit 11)
          - { php: '8.2', laravel: '12', testbench: '^10.0' }
          - { php: '8.5', laravel: '12', testbench: '^10.0' }

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, pdo
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      # composer.lock is gitignored, so the key hashes composer.json instead.
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-

      # Pin this lane's Laravel major. Without this the matrix's `laravel` axis
      # does nothing and every lane resolves to the newest Laravel its PHP allows.
      # Pint and Rector are dev tools the tests don't use; Pint needs PHP 8.2+
      # and would make the PHP 8.0/8.1 lanes unresolvable.
      - name: Pin Laravel ${{ matrix.laravel }}
        run: |
          composer remove --dev laravel/pint rector/rector --no-update --no-interaction
          composer require "illuminate/database:^${{ matrix.laravel }}.0" "illuminate/support:^${{ matrix.laravel }}.0" --no-update --no-interaction
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-ansi --no-interaction --no-progress

      - name: Show resolved versions
        run: composer show --no-ansi | grep -E '^(laravel/framework|phpunit/phpunit|orchestra/testbench) '

      - name: Execute Unit Tests
        run: composer test:unit

      # Integration tests run only on main, with secrets, and in a single lane so
      # concurrent matrix jobs don't hit the same Snowflake schema at once. With
      # no secrets configured the runner script exits 0 without running anything.
      - name: Execute Integration Tests
        if: github.ref == 'refs/heads/main' && matrix.php == '8.5' && matrix.laravel == '12'
        env:
          SNOWFLAKE_TEST_URL: ${{ secrets.SNOWFLAKE_TEST_URL }}
          SNOWFLAKE_TEST_ACCOUNT: ${{ secrets.SNOWFLAKE_TEST_ACCOUNT }}
          SNOWFLAKE_TEST_USER: ${{ secrets.SNOWFLAKE_TEST_USER }}
          SNOWFLAKE_TEST_PUBLIC_KEY: ${{ secrets.SNOWFLAKE_TEST_PUBLIC_KEY }}
          SNOWFLAKE_TEST_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_TEST_PRIVATE_KEY }}
          SNOWFLAKE_TEST_PASSPHRASE: ${{ secrets.SNOWFLAKE_TEST_PASSPHRASE }}
          SNOWFLAKE_TEST_WAREHOUSE: ${{ secrets.SNOWFLAKE_TEST_WAREHOUSE }}
          SNOWFLAKE_TEST_DATABASE: ${{ secrets.SNOWFLAKE_TEST_DATABASE }}
          SNOWFLAKE_TEST_SCHEMA: ${{ secrets.SNOWFLAKE_TEST_SCHEMA }}
        run: composer test:integration
